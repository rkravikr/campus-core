<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Definitions for High-End Gradients and Filters -->
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#18153c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>

    <!-- Left 'C' Gradient (Cyan to Indigo) -->
    <linearGradient id="left-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Right 'C' Gradient (Stellar Purple to Neon Pink) -->
    <linearGradient id="right-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b152ff"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>

    <!-- Central Core Star Glow -->
    <linearGradient id="core-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>

    <!-- Premium Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambient-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" result="blur"/>
    </filter>
  </defs>

  <!-- Deep Velvet Tech Background -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)"/>

  <!-- Subtle High-Tech Measurement Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1.5">
    <circle cx="256" cy="256" r="200" stroke-dasharray="6 12"/>
    <circle cx="256" cy="256" r="140" stroke-dasharray="3 9"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
  </g>

  <!-- Giant Ambient Colorful Aura -->
  <circle cx="200" cy="256" r="80" fill="#00f2fe" opacity="0.12" filter="url(#ambient-glow)"/>
  <circle cx="312" cy="256" r="80" fill="#ff2a85" opacity="0.12" filter="url(#ambient-glow)"/>

  <!-- Left 'C' - Campus (Cyan to Blue Ribbon) -->
  <path d="M 310,150 C 190,150 146,200 146,256 C 146,312 190,362 310,362" 
        stroke="url(#left-c-grad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#neon-glow)"
        opacity="0.95"
  />

  <!-- Right 'C' - Core (Violet to Pink Ribbon) Interlocking Overlap -->
  <path d="M 366,150 C 246,150 202,200 202,256 C 202,312 246,362 366,362" 
        stroke="url(#right-c-grad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#neon-glow)"
        opacity="0.9"
  />

  <!-- High-Light Overlap Accent / Intersection Glow -->
  <!-- A subtle overlapping crescent to add dimension -->
  <path d="M 230,200 C 212,220 202,238 202,256 C 202,274 212,292 230,312" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"
        opacity="0.4"
  />

  <!-- Central Academic Core - Glowing 4-Point Starburst -->
  <!-- Outer Glow Halo -->
  <g transform="translate(256, 256)" filter="url(#neon-glow)">
    <path d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z" 
          fill="url(#core-glow-grad)"
          opacity="0.9"
    />
    <!-- Hyper-bright core nucleus -->
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" 
          fill="#ffffff"
    />
  </g>

  <!-- Modern Elegant Wordmark Tag at the bottom -->
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="9" fill="#ffffff" opacity="0.55" text-anchor="middle">
    CAMPUS CORE
  </text>
</svg>
